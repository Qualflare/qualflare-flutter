name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - name: Markers land on the right test in the JSON results
        run: |
          set -euo pipefail
          flutter test --file-reporter json:results.json test/qualflare_widget_test.dart
          id=$(jq -r 'select(.type=="testStart" and .test.name=="works inside testWidgets") | .test.id' results.json)
          test -n "$id"
          jq -s -e --argjson id "$id" '[.[] | select(.type=="print" and .testID==$id) | .message | select(startswith("##qualflare[v1] "))] | length == 3' results.json
          jq -s -e --argjson id "$id" '[.[] | select(.type=="print" and .testID==$id) | .message | select(startswith("##qualflare[v1] {\"k\":\"label\""))] | length == 1 and (.[0] | contains("mobile-team"))' results.json

  example-widget:
    name: Example (widget)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
      - name: Run the example widget tests
        working-directory: example
        run: |
          flutter pub get
          flutter test test/checkout_widget_test.dart --file-reporter json:../results-widget.json || true
      - name: Markers of every kind landed on the right tests
        run: |
          set -euo pipefail
          example/tool/assert_markers.sh results-widget.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: results-widget
          path: results-widget.json
          if-no-files-found: error

  example-android:
    name: Example (Android emulator)
    env:
      DOGFOOD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
      - run: flutter pub get
        working-directory: example
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          working-directory: example
          script: |
            flutter test integration_test/checkout_test.dart -d emulator-5554 --file-reporter json:../results-android.json || true
            [ "$DOGFOOD" != true ] || flutter test integration_test/checkout_test.dart -d emulator-5554 --exclude-tags demo-failure --file-reporter json:../dogfood-android.json || true
      - name: Markers of every kind landed on the right tests, native screenshot included
        run: |
          set -euo pipefail
          example/tool/assert_markers.sh results-android.json native
      # Dogfood, main only: the example's results land in the qualflare-flutter
      # project that the README badge reads. The upload comes from a second run
      # without the deliberately failing test (tag demo-failure), so the badge
      # reflects real health; the full run above keeps every marker check.
      - name: Install qf
        if: env.DOGFOOD == 'true'
        run: |
          npm install -g @qualflare/cli
          qf version
      - name: Record the project's run count before uploading
        id: runs_before
        if: env.DOGFOOD == 'true'
        run: echo "count=$(python3 example/tool/assert-launch-landed.py qualflare-flutter --print)" >> "$GITHUB_OUTPUT"
      # The token goes via the environment, not argv. `qf <id> collect` only exists
      # after a successful login, so these cannot be reordered.
      - name: Upload to Qualflare
        id: upload
        if: env.DOGFOOD == 'true'
        env:
          QF_TOKEN: ${{ secrets.QF_TOKEN }}
          QF_BRANCH: ${{ github.ref_name }}
          QF_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$QF_TOKEN" ]; then
            echo "::error::QF_TOKEN is not set on this repository."
            exit 1
          fi
          test -s dogfood-android.json
          qf login qualflare-flutter --force
          qf qualflare-flutter collect dogfood-android.json --platform android
      - name: Assert the launch reached the project the badge reads
        if: env.DOGFOOD == 'true' && steps.upload.outcome == 'success'
        run: python3 example/tool/assert-launch-landed.py qualflare-flutter --before "${{ steps.runs_before.outputs.count }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: results-android
          path: results-android.json
          if-no-files-found: error

  example-ios:
    name: Example (iOS simulator)
    env:
      DOGFOOD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
      - run: flutter pub get
        working-directory: example
      - name: Boot the newest iPhone simulator
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | startswith("iPhone"))]
            | sort_by(.name) | last | .udid')
          test -n "$udid" && test "$udid" != null
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
      - name: Run the example integration test
        timeout-minutes: 70
        working-directory: example
        run: flutter test integration_test/checkout_test.dart -d "$SIM_UDID" --file-reporter json:../results-ios.json || true
      - name: Run the example again for the dogfood upload, without the deliberate failure
        if: env.DOGFOOD == 'true'
        timeout-minutes: 70
        working-directory: example
        run: flutter test integration_test/checkout_test.dart -d "$SIM_UDID" --exclude-tags demo-failure --file-reporter json:../dogfood-ios.json || true
      - name: Markers of every kind landed on the right tests, native screenshot included
        run: |
          set -euo pipefail
          example/tool/assert_markers.sh results-ios.json native
      # Dogfood, main only: the example's results land in the qualflare-flutter
      # project that the README badge reads. The upload comes from a second run
      # without the deliberately failing test (tag demo-failure), so the badge
      # reflects real health; the full run above keeps every marker check.
      - name: Install qf
        if: env.DOGFOOD == 'true'
        run: |
          npm install -g @qualflare/cli
          qf version
      - name: Record the project's run count before uploading
        id: runs_before
        if: env.DOGFOOD == 'true'
        run: echo "count=$(python3 example/tool/assert-launch-landed.py qualflare-flutter --print)" >> "$GITHUB_OUTPUT"
      # The token goes via the environment, not argv. `qf <id> collect` only exists
      # after a successful login, so these cannot be reordered.
      - name: Upload to Qualflare
        id: upload
        if: env.DOGFOOD == 'true'
        env:
          QF_TOKEN: ${{ secrets.QF_TOKEN }}
          QF_BRANCH: ${{ github.ref_name }}
          QF_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$QF_TOKEN" ]; then
            echo "::error::QF_TOKEN is not set on this repository."
            exit 1
          fi
          test -s dogfood-ios.json
          qf login qualflare-flutter --force
          qf qualflare-flutter collect dogfood-ios.json --platform ios
      - name: Assert the launch reached the project the badge reads
        if: env.DOGFOOD == 'true' && steps.upload.outcome == 'success'
        run: python3 example/tool/assert-launch-landed.py qualflare-flutter --before "${{ steps.runs_before.outputs.count }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: results-ios
          path: results-ios.json
          if-no-files-found: error
